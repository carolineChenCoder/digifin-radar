name: daily

on:
  schedule:
    # UTC 00:23 = 北京时间 08:23，工作日。分钟特意避开整点，错开 GitHub Actions 的排队高峰。
    - cron: '23 0 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: digifin-radar-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: run radar
        run: python run.py --mode daily
        env:
          LARK_WEBHOOK_URL: ${{ secrets.LARK_WEBHOOK_URL }}
          LARK_WEBHOOK_SECRET: ${{ secrets.LARK_WEBHOOK_SECRET }}

      - name: persist seen state
        run: |
          git config user.name "digifin-radar"
          git config user.email "bot@users.noreply.github.com"
          git add state/seen.json
          git diff --staged --quiet || git commit -m "chore: update seen state [skip ci]"
          git push
